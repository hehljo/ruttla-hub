name: Falsch-positiv
description: Eine Hub-Regel meldet etwas, das korrekt ist
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Regel-ID (hub.<paket>.<regel>) und Paketversion
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimaler Ausschnitt, der gemeldet wird (wird zur pass-Fixture)
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Warum ist das korrekt?
    validations:
      required: true
